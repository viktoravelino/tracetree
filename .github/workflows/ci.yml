name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# One job per concern, so a failure names itself and a branch ruleset can
# require each by name.
jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.9
      - run: bun install --frozen-lockfile
      - run: bun run typecheck

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.9
      - run: bun install --frozen-lockfile
      - run: bun run lint

  # The end-to-end check: build a synthetic ~/.claude, index it, and read it
  # back through the CLI. Exercises discovery, ingest, the schema and the query
  # layer against data with a nested spawn tree in it, which no type can prove.
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.9
      - run: bun install --frozen-lockfile

      - name: Index the demo transcripts
        run: bun run demo --no-serve

      - name: The CLI reads back what was indexed
        run: |
          set -euo pipefail
          stats=$(bun run src/cli.ts stats --root .demo/claude --db .demo/index.db)
          echo "$stats"
          grep -qE 'sessions +6'  <<<"$stats" || { echo "::error::expected 6 sessions"; exit 1; }
          grep -qE 'agents +4'    <<<"$stats" || { echo "::error::expected 4 agents";   exit 1; }

      - name: The spawn tree nests
        run: |
          set -euo pipefail
          tree=$(bun run src/cli.ts tree 7c2f1a44 --root .demo/claude --db .demo/index.db)
          echo "$tree"
          # The fourth agent is spawned by the third, so its row is indented
          # under it rather than hanging off the main thread.
          grep -q '   └─ \[general-purpose\] Break down the outlier key' <<<"$tree" \
            || { echo "::error::the nested agent is not nested"; exit 1; }

      - name: The web bundle builds
        run: bun build web/index.html --outdir /tmp/webbuild

  # Installs the tarball into an empty project and serves it. The smoke job
  # builds from a checkout where every devDependency is present, so it cannot
  # tell a runtime dependency in the wrong section from a correct one; only an
  # install somewhere else can.
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.9
      - run: scripts/verify-package.sh
