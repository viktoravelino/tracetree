name: Feature request
description: Something tracetree should do that it does not
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        This project tries to stay small. The most useful thing you can describe
        is the question you were trying to answer about your sessions, rather
        than the feature you imagine answering it — the second one is easier to
        design once the first is clear.

  - type: textarea
    id: problem
    attributes:
      label: What were you trying to find out?
    validations:
      required: true

  - type: textarea
    id: today
    attributes:
      label: What do you do today instead?
      description: Including "nothing, I gave up" — that is useful to know.

  - type: textarea
    id: idea
    attributes:
      label: What you have in mind, if anything
